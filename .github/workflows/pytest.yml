name: Grade Checks Pytest
on:
  push:
    branches: [main]
    paths:
      - '05_grade_checks/**'
      - '.github/workflows/pytest.yml'
  pull_request:
    branches: [main]
    paths:
      - '05_grade_checks/**'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:
concurrency:
  group: grade-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        working-directory: 05_grade_checks
        run: python -m pytest -v
